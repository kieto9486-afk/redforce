<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;background:#0e0c0a;font-family:'Noto Sans KR',sans-serif;position:relative;overflow:hidden;display:flow-root}
.photo{position:absolute;inset:0;background:url(../images/chicken.jpg) center 55%/cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.96) 0%,rgba(10,8,6,.88) 30%,rgba(10,8,6,.25) 55%,rgba(10,8,6,0) 75%,rgba(10,8,6,.55) 100%)}
.frame{position:absolute;inset:28px;border:2px solid #c99a3e;border-radius:6px}
.top{position:relative;text-align:center;margin-top:84px}
.h{font-family:'Black Han Sans';font-size:118px;line-height:1;color:#fff;letter-spacing:-2px;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.h .n{color:#e8322a;font-size:150px}.h .g{color:#f2c862}
.s{margin-top:24px;font-size:38px;font-weight:900;color:#f2c862}
.s i{font-style:normal;color:#8a7a5a;margin:0 18px}
.badge{position:absolute;left:64px;bottom:64px;background:#c8211b;color:#fff;font-weight:900;font-size:34px;padding:14px 30px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
</style>
<div class="photo"></div><div class="shade"></div><div class="frame"></div>
<div class="top"><p class="h">포장하면 <span class="n">10%</span> <span class="g">할인</span></p>
<p class="s">배달비 0원 꿀팁<i>|</i>교촌앱 3분 주문법</p></div>
<div class="badge">솔직 후기</div>
