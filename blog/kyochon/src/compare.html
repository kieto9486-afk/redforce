<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;background:#0e0c0a;font-family:'Noto Sans KR',sans-serif;color:#f5ead6;position:relative;overflow:hidden;display:flow-root}
.frame{position:absolute;inset:28px;border:2px solid #b8913f;border-radius:6px}
.frame2{position:absolute;inset:40px;border:1px solid rgba(184,145,63,.45);border-radius:4px}
h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:84px;line-height:1.12;text-align:center;color:#f2c862;margin-top:92px;letter-spacing:-1px}
.sub{text-align:center;font-size:26px;color:#c9b894;margin-top:14px}
.cols{display:flex;gap:28px;margin:52px 72px 0}
.col{flex:1;border-radius:14px;padding:30px 32px}
.d{background:#1b1816;border:2px solid #4a2320}
.p{background:#1f1a10;border:3px solid #e2b84f;box-shadow:0 0 40px rgba(226,184,79,.35)}
.col h2{font-size:34px;font-weight:900;text-align:center;margin-bottom:22px}
.d h2{color:#e2453a}.p h2{color:#f2c862}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:27px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.tot{border:none;padding-top:20px;font-size:30px}
.tot span:last-child{font-size:44px;font-family:'Black Han Sans';font-weight:400}
.d .tot span:last-child{color:#e2453a}.p .tot span:last-child{color:#f2c862}
.hl{color:#ff5a4c}
.bottom{position:absolute;left:72px;right:72px;bottom:120px;text-align:center;font-family:'Black Han Sans';font-size:52px;color:#fff}
.bottom b{color:#f2c862;font-weight:400}
.note{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:19px;color:#8f846f}
</style>
<div class="frame"></div><div class="frame2"></div>
<h1>배달 vs 포장,<br>뭐가 더 이득일까?</h1>
<p class="sub">허니갈릭윙박스 20PCS × 2개 기준</p>
<div class="cols">
 <div class="col d"><h2>교촌앱 배달</h2>
  <div class="row"><span>메뉴 가격</span><span>46,000원</span></div>
  <div class="row"><span>배달비</span><span>+4,000원</span></div>
  <div class="row"><span>할인</span><span>없음</span></div>
  <div class="row tot"><span>결제</span><span>50,000원</span></div>
 </div>
 <div class="col p"><h2>교촌앱 포장</h2>
  <div class="row"><span>메뉴 가격</span><span>46,000원</span></div>
  <div class="row"><span>배달비</span><span>0원</span></div>
  <div class="row"><span>포장 할인</span><span class="hl">-4,600원</span></div>
  <div class="row tot"><span>결제</span><span>41,400원</span></div>
 </div>
</div>
<div class="bottom">같은 치킨, <b>8,600원</b> 차이!</div>
<p class="note">* 교촌앱 화면 기준(경기 화성 봉담1호점, 2026.10.27). 배달비는 매장마다 다를 수 있어요.</p>
